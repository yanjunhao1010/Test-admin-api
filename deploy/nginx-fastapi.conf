# Nginx 反向代理配置
# 安装位置：/etc/nginx/conf.d/fastapi.conf
# 生效：nginx -t && systemctl reload nginx
server {
    listen       80;
    listen       [::]:80;
    server_name  _;             # 暂未绑定域名，直接用 ECS 公网 IP 访问

    # Excel 用例上传接口需要更大的请求体上限
    # Nginx 默认只有 1m，上传表格会直接返回 413
    client_max_body_size 50m;

    access_log /var/log/nginx/fastapi.access.log;
    error_log  /var/log/nginx/fastapi.error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /api/ais/chat 是长耗时请求，默认 60s 会 504
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 关闭缓冲，便于流式响应
        proxy_buffering off;
    }
}

